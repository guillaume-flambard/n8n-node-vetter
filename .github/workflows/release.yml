name: Release

# Publishes to npm with a provenance statement, via trusted publishing (OIDC) —
# no stored token. This is the same publish path n8n now requires of verified
# community nodes, so the vetter is published the way it tells others to publish.
#
# One-time setup on npmjs.com > package Settings > Trusted Publisher:
#   provider = GitHub Actions, owner = guillaume-flambard,
#   repository = n8n-node-vetter, workflow filename = release.yml
#
# Trigger: push a version tag.  npm version patch && git push --follow-tags

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Without id-token: write, npm cannot sign provenance and --provenance fails.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG and package.json $PKG diverge."
            exit 1
          fi
      - run: npm publish --provenance --access public
